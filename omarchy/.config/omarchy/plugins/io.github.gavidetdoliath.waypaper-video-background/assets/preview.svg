<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#171126"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252d63"/>
      <stop offset="0.45" stop-color="#426b8f"/>
      <stop offset="0.68" stop-color="#ec9f78"/>
      <stop offset="1" stop-color="#ffd49b"/>
