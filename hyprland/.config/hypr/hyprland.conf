# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.local/state/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu
# Hide Discord screen-sharing popup
# Hide Discord screen-sharing popup dynamically
# Hide Discord screen-sharing popup completely
# Hide Discord screen-sharing popup completely
# Hide Discord screen-sharing popup on Omarchy Linux / Hyprland
# Hide Discord screen-sharing popup completely
windowrule = match:title "discord.com is sharing your screen.", match:xwayland false, workspace special silent

# Prevent PIP windows from stealing focus and teleporting the cursor.
# Matches Firefox "Picture-in-Picture" and Chrome "Picture in Picture".
windowrule = float on, match:title [Pp]icture.in.[Pp]icture
windowrule = no_initial_focus on, match:title [Pp]icture.in.[Pp]icture
windowrule = suppress_event activate activatefocus, match:title [Pp]icture.in.[Pp]icture
render {
    cm_auto_hdr = 0
}

# Allow immediate presentation / zero tearing latency in Steam games
windowrulev2 = immediate, class:^(steam_app_.*)$

# Omarchy: dynamic toggles (not in dot repo; keeps `omarchy toggle …` working)
source = ~/.local/state/omarchy/toggles/hypr/*.conf

# Tensaku: float + center its window. Tensaku sizes its own window
# around the capture, so it must float with no fixed-size rule. The
# `tag -floating-window` undoes a distro default (e.g. Omarchy's) that
# would otherwise pin a fixed size. Added by `tensaku --wire-omarchy`.
windowrule = tag -floating-window, match:class dev.tensaku.Tensaku
windowrule = float on, match:class dev.tensaku.Tensaku
windowrule = center on, match:class dev.tensaku.Tensaku
